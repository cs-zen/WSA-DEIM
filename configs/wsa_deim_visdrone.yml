task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 10
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/VisDrone2019-DET/images/train
    ann_file: ./data/VisDrone2019-DET/annotations/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 144
        - 280
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
  shuffle: true
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 280
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 144
  total_batch_size: 4
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/VisDrone2019-DET/images/val
    ann_file: ./data/VisDrone2019-DET/annotations/instances_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
print_freq: 100
output_dir: ./outputs/wsa_deim_visdrone_seed0
checkpoint_freq: 30
sync_bn: true
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 300
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*(?:norm|bn)).*$
    lr: 0.0001
  - params: ^(?=.*backbone)(?=.*(?:norm|bn)).*$
    lr: 0.0001
    weight_decay: 0.0
  - params: ^(?!.*backbone)(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 144
no_aug_epoch: 20
HGNetv2:
  pretrained: false
  stem_type: pdc
  name: B0
  return_idx:
  - 0
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  stem_options:
    filters_per_channel: 4
    initial_residual_scale: 0.1
    max_residual_scale: 0.5
HybridEncoder:
  in_channels:
  - 64
  - 256
  - 512
  - 1024
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  hidden_dim: 256
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  fpn:
    type: HaarFPN
    num_levels: 4
    hidden_dim: 256
    alignment_reduction: 16
    post_fusion:
      type: MultiScaleDWEnhancement
      channels: 256
  pan:
    type: HaarPAN
    num_levels: 4
    hidden_dim: 256
    post_fusion:
      type: MultiScaleDWEnhancement
      channels: 256
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  - 256
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 4
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 4
  - 4
  - 4
  - 4
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  anchor_grid_size: 0.025
PostProcessor:
  num_top_queries: 300
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
  losses:
  - mal
  - boxes
  - local
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
remap_category_ids: true
seed: 0
